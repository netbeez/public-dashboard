name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  php-syntax:
    name: php-syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP
        run: sudo apt-get update && sudo apt-get install -y php-cli

      - name: Lint PHP files
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -name '*.php' -print0)
          if ((${#files[@]} == 0)); then
            echo "No PHP files found"
            exit 1
          fi
          status=0
          for file in "${files[@]}"; do
            php -l "$file" || status=1
          done
          exit "$status"
